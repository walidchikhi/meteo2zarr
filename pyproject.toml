[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteo2zarr"
version = "0.1.0"
description = "High-performance Numerical Weather Prediction (NWP) to Zarr conversion and cartographic analysis engine."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Walid Chikhi", email = "waliidchikhi@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["meteorology", "nwp", "zarr", "dask", "xarray", "weather", "arome", "aladin", "grib", "fa"]
requires-python = ">=3.9"
dependencies = [
    "xarray>=2023.01.0",
    "zarr>=2.14.0",
    "dask[complete]>=2023.01.0",
    "distributed>=2023.01.0",
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "numcodecs>=0.11.0",
    "matplotlib>=3.6.0",
    "cartopy>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx_rtd_theme>=1.2.0",
    "myst_parser>=1.0.0",
    "sphinx-copybutton>=0.5.0",
]

[project.scripts]
meteo2zarr = "meteo2zarr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meteo2zarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
