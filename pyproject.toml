[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meteo2zarr"
version = "1.0.0"
description = "High-performance NWP to Zarr conversion and cartographic visualization engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MeteoAlgerie Team" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "zarr>=2.16.0,<3.0.0",
    "xarray>=2023.1.0",
    "dask[array]>=2023.1.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "eccodes>=1.6.0",
    "numcodecs>=0.11.0",
    "matplotlib>=3.6.0",
    "shapely>=1.8.5,<2.0.0",
    "cartopy>=0.21.0,<0.23.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
meteo2zarr = "meteo2zarr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meteo2zarr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
