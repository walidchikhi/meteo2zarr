name: CI & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11","3.12"]
#        python-version: ["3.11","3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system C-libraries (ecCodes & Cartopy dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools libgeos-dev libproj-dev proj-data proj-bin

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package, requirements and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Test Suite with Pytest
        run: |
          pytest -v --cov=meteo2zarr --cov-report=term-missing tests/
