name: Publish to PyPI

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build binary wheel and source distribution
        run: |
          python -m build

      - name: Check package validity with Twine
        run: |
          twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses PyPI trusted publishing (no manual API tokens needed if configured)
          # Alternatively uses PYPI_API_TOKEN repository secret
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
