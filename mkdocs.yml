site_name: NWP to Zarr Converter
site_description: High-performance conversion of AROME/ALADIN FA files to Zarr using Dask and Slurm.
site_author: PNT Metview Team
repo_url: https://github.com/pnt/nwp2zarr

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

nav:
  - Overview: index.md
  - Guide:
      - Installation: guide/installation.md
      - Usage: guide/usage.md
      - Configuration: guide/configuration.md
  - Technical:
      - Architecture: technical/architecture.md
      - Accumulation Logic: technical/accumulations.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
